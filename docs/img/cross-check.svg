<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="title desc">
  <title id="title">Cross-check flow</title>
  <desc id="desc">The collector and ccusage read the same transcripts independently, once a week. compare sums usage rows per day and model and checks them against the ccusage totals. Context sizes, the third reader, feed analyze and report and are not compared.</desc>
  <style>
    .bg { fill: #f6f8fa; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .blue { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
    .green { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1; }
    .orange { fill: #fff1e5; stroke: #fb8f44; stroke-width: 1; }
    .purple { fill: #fbefff; stroke: #c297ff; stroke-width: 1; }
    .red { fill: #ffebe9; stroke: #ff8182; stroke-width: 1; }
    .ink { fill: #59636e; }
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .s { font-size: 12px; fill: #59636e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .num { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .line { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .line-blue { stroke: #0969da; stroke-width: 1.5; fill: none; }
    .line-purple { stroke: #8250df; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .line-red { stroke: #cf222e; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .a-grey { fill: #8c959f; }
    .a-blue { fill: #0969da; }
    .a-purple { fill: #8250df; }
    .a-red { fill: #cf222e; }
    .dot-blue { fill: #0969da; }
    .dot-green { fill: #1a7f37; }
    .dot-orange { fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .blue { fill: #0f2140; stroke: #1f6feb; }
      .green { fill: #0f2a1a; stroke: #2ea043; }
      .orange { fill: #2b1a0c; stroke: #db6d28; }
      .purple { fill: #231a36; stroke: #8957e5; }
      .red { fill: #2d1214; stroke: #da3633; }
      .ink { fill: #9198a1; }
      text { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .num { fill: #0d1117; }
      .line { stroke: #6e7681; }
      .line-blue { stroke: #4493f8; }
      .line-purple { stroke: #ab7df8; }
      .line-red { stroke: #f85149; }
      .a-grey { fill: #6e7681; }
      .a-blue { fill: #4493f8; }
      .a-purple { fill: #ab7df8; }
      .a-red { fill: #f85149; }
      .dot-blue { fill: #4493f8; }
      .dot-green { fill: #3fb950; }
      .dot-orange { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-grey" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="372" rx="16"/>
  <text x="24" y="40" class="h">Cross-check</text>
  <text x="130" y="40" class="s">independent readings of the same transcripts, checked against each other</text>
  <rect class="card" x="24" y="68" width="168" height="280" rx="10"/>
  <text x="40" y="200" class="b">Transcripts</text>
  <text x="40" y="219" class="s">~/.claude/projects</text>
  <path class="line-blue" d="M192,108 L230,108" marker-end="url(#m-blue)"/>
  <rect class="blue" x="232" y="68" width="180" height="80" rx="10"/>
  <text x="248" y="94" class="b">collect</text>
  <text x="248" y="113" class="s">one row per message</text>
  <path class="line-blue" d="M412,108 L438,108" marker-end="url(#m-blue)"/>
  <rect class="blue" x="440" y="68" width="200" height="80" rx="10"/>
  <text x="456" y="94" class="b">Usage rows</text>
  <text x="456" y="113" class="s">&lt;account&gt;/YYYY/MM/</text>
  <text x="456" y="132" class="s">YYYY-MM-DD.csv</text>
  <path class="line-blue" d="M640,108 L678,108" marker-end="url(#m-blue)"/>
  <path class="line-purple" d="M192,208 L230,208" marker-end="url(#m-purple)"/>
  <rect class="purple" x="232" y="168" width="180" height="80" rx="10"/>
  <text x="248" y="194" class="b">crosscheck</text>
  <text x="248" y="213" class="s">ccusage daily --json</text>
  <text x="248" y="232" class="s">one ISO week, guarded</text>
  <path class="line-purple" d="M412,208 L438,208" marker-end="url(#m-purple)"/>
  <rect class="purple" x="440" y="168" width="200" height="80" rx="10"/>
  <text x="456" y="194" class="b">Check totals</text>
  <text x="456" y="213" class="s">checks/&lt;account&gt;/</text>
  <text x="456" y="232" class="s">&lt;machine&gt;/YYYY-Www.json</text>
  <path class="line-purple" d="M640,208 L678,208" marker-end="url(#m-purple)"/>
  <path class="line" d="M192,308 L230,308" marker-end="url(#m-grey)"/>
  <rect class="green" x="232" y="268" width="180" height="80" rx="10"/>
  <text x="248" y="294" class="b">collect</text>
  <text x="248" y="313" class="s">one row per context</text>
  <path class="line" d="M412,308 L438,308" marker-end="url(#m-grey)"/>
  <rect class="green" x="440" y="268" width="200" height="80" rx="10"/>
  <text x="456" y="294" class="b">Context sizes</text>
  <text x="456" y="313" class="s">&lt;account&gt;/YYYY/MM/</text>
  <text x="456" y="332" class="s">YYYY-MM-DD.context.csv</text>
  <path class="line" d="M640,308 L678,308" marker-end="url(#m-grey)"/>
  <rect class="card" x="680" y="68" width="256" height="180" rx="10"/>
  <text x="696" y="98" class="h">compare</text>
  <text x="696" y="130" class="s">sum rows by day and model,</text>
  <text x="696" y="149" class="s">set against check totals</text>
  <text x="696" y="168" class="s">of each week or month</text>
  <text x="696" y="206" class="s">gap over tolerance:</text>
  <text x="696" y="225" class="b">exit 1</text>
  <rect class="card" x="680" y="268" width="256" height="80" rx="10"/>
  <text x="696" y="294" class="b">analyze, report</text>
  <text x="696" y="313" class="s">starting context and parts,</text>
  <text x="696" y="332" class="s">not part of compare</text>
</svg>
