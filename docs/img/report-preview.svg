@media (prefers-color-scheme: dark) { svg { --bg: #121211; --surface: #1a1a19; --border: #2e2e2b; --text: #f0efec; --muted: #c3c2b7; --faint: #8f8e86; --grid: #272725; --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --rest: #4a4a46; } }

