<svg xmlns="http://www.w3.org/2000/svg" width="960" height="326" viewBox="0 0 960 326" role="img" aria-labelledby="title desc">
  <title id="title">Daily run pipeline</title>
  <desc id="desc">claude-usage run reads new transcript lines, extracts usage rows and context sizes from allowlisted fields, guards every column of every file, writes day files, runs the weekly ccusage cross-check, then audits, commits, rebases and pushes a git store. A guard failure writes nothing. An audit failure commits and pushes nothing.</desc>
  <style>
    .bg { fill: #faf9f5; }
    .card { fill: #ffffff; stroke: #dedcd1; stroke-width: 1; }
    .blue { fill: #e6eef6; stroke: #6a9bcc; stroke-width: 1; }
    .green { fill: #eaefe4; stroke: #788c5d; stroke-width: 1; }
    .orange { fill: #f8e6de; stroke: #d97757; stroke-width: 1; }
    .purple { fill: #f5e6ed; stroke: #c46686; stroke-width: 1; }
    .red { fill: #f7e9e7; stroke: #c9645a; stroke-width: 1; }
    .ink { fill: #5e5d59; }
    text { fill: #141413; font-family: 'Anthropic Sans', system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .s { font-size: 12px; fill: #5e5d59; }
    .mono { font-family: 'Anthropic Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .num { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .line { stroke: #87867f; stroke-width: 1.5; fill: none; }
    .line-blue { stroke: #3d6fa3; stroke-width: 1.5; fill: none; }
    .line-purple { stroke: #a64d87; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .line-red { stroke: #b5544a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .a-grey { fill: #87867f; }
    .a-blue { fill: #3d6fa3; }
    .a-purple { fill: #a64d87; }
    .a-red { fill: #b5544a; }
    .dot-blue { fill: #3d6fa3; }
    .dot-green { fill: #5e7a45; }
    .dot-orange { fill: #c2613f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #141413; }
      .card { fill: #1f1e1d; stroke: #3d3d3a; }
      .blue { fill: #1b2530; stroke: #6a9bcc; }
      .green { fill: #1d241b; stroke: #788c5d; }
      .orange { fill: #2e1e18; stroke: #d97757; }
      .purple { fill: #2b1c23; stroke: #c46686; }
      .red { fill: #2e1a19; stroke: #c9645a; }
      .ink { fill: #b0aea5; }
      text { fill: #faf9f5; }
      .s { fill: #b0aea5; }
      .num { fill: #141413; }
      .line { stroke: #87867f; }
      .line-blue { stroke: #6a9bcc; }
      .line-purple { stroke: #d58ba6; }
      .line-red { stroke: #e07a6e; }
      .a-grey { fill: #87867f; }
      .a-blue { fill: #6a9bcc; }
      .a-purple { fill: #d58ba6; }
      .a-red { fill: #e07a6e; }
      .dot-blue { fill: #6a9bcc; }
      .dot-green { fill: #9db57e; }
      .dot-orange { fill: #d97757; }
    }
  </style>
  <defs>
    <marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-grey" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="326" rx="16"/>
  <text x="24" y="38" class="h">One daily run</text>
  <text x="140" y="38" class="s">claude-usage run, started by launchd at your schedule time</text>
  <rect class="card" x="24" y="60" width="160" height="110" rx="10"/>
  <circle class="dot-blue" cx="50" cy="86" r="11"/>
  <text x="50" y="90" class="num" text-anchor="middle">1</text>
  <text x="70" y="91" class="h">Read</text>
  <text x="40" y="124" class="s">new lines only</text>
  <text x="40" y="144" class="s">offsets per stream</text>
  <path class="line" d="M184,115 L210,115" marker-end="url(#m-grey)"/>
  <rect class="card" x="212" y="60" width="160" height="110" rx="10"/>
  <circle class="dot-blue" cx="238" cy="86" r="11"/>
  <text x="238" y="90" class="num" text-anchor="middle">2</text>
  <text x="258" y="91" class="h">Extract</text>
  <text x="228" y="124" class="s">usage rows, context</text>
  <text x="228" y="144" class="s">sizes, skills, names</text>
  <path class="line" d="M372,115 L398,115" marker-end="url(#m-grey)"/>
  <rect class="green" x="400" y="60" width="160" height="110" rx="10"/>
  <circle class="dot-blue" cx="426" cy="86" r="11"/>
  <text x="426" y="90" class="num" text-anchor="middle">3</text>
  <text x="446" y="91" class="h">Guard</text>
  <text x="416" y="124" class="s">one schema per file</text>
  <text x="416" y="144" class="s">any fail: stop</text>
  <path class="line" d="M560,115 L586,115" marker-end="url(#m-grey)"/>
  <rect class="card" x="588" y="60" width="160" height="110" rx="10"/>
  <circle class="dot-blue" cx="614" cy="86" r="11"/>
  <text x="614" y="90" class="num" text-anchor="middle">4</text>
  <text x="634" y="91" class="h">Write</text>
  <text x="604" y="124" class="s">append day CSVs</text>
  <text x="604" y="144" class="s">then save offsets</text>
  <path class="line" d="M748,115 L774,115" marker-end="url(#m-grey)"/>
  <rect class="card" x="776" y="60" width="160" height="110" rx="10"/>
  <circle class="dot-blue" cx="802" cy="86" r="11"/>
  <text x="802" y="90" class="num" text-anchor="middle">5</text>
  <text x="822" y="91" class="h">Push (git)</text>
  <text x="792" y="124" class="s">audit, commit,</text>
  <text x="792" y="144" class="s">rebase, audit, push</text>
  <path class="line-red" d="M480,170 L480,206" marker-end="url(#m-red)"/>
  <rect class="red" x="212" y="208" width="360" height="40" rx="10"/>
  <text x="226" y="233" class="s">Guard fails: no file written, exit 1, offsets kept</text>
  <path class="line-purple" d="M800,206 L800,172" marker-end="url(#m-purple)"/>
  <rect class="purple" x="596" y="208" width="260" height="40" rx="10"/>
  <text x="610" y="233" class="s">Once a week: ccusage cross-check</text>
  <path class="line-red" d="M900,170 L900,264" marker-end="url(#m-red)"/>
  <rect class="red" x="596" y="266" width="340" height="40" rx="10"/>
  <text x="610" y="291" class="s">Audit fails: nothing pushed, exit 1</text>
</svg>
