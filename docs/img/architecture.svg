<svg xmlns="http://www.w3.org/2000/svg" width="960" height="752" viewBox="0 0 960 752" role="img" aria-labelledby="title desc">
  <title id="title">claude-usage-collector architecture</title>
  <desc id="desc">Each machine reads its transcripts with three readers, replaces every id and name with a salted hash, checks every column with a guard, and audits every file again before a push. Only numbers and hashes reach the private data store. Transcripts, the salt, the name map and the state file stay on the machine. A research machine pulls the store and shows real names only where its own local name map knows the hash.</desc>
