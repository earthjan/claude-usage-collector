    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="752" rx="16"/>
  <text x="32" y="40" class="h">How the pieces fit</text>
  <text x="200" y="40" class="s">each machine reads, hashes, guards and audits, and sends numbers and hashes only</text>
  <rect class="card" x="32" y="64" width="624" height="312" rx="10"/>
  <text x="48" y="88" class="b">Machine A, account: work</text>
  <rect class="card" x="48" y="102" width="112" height="134" rx="8"/>
  <text x="60" y="160" class="b">transcripts</text>
  <text x="60" y="178" class="s">~/.claude/</text>
  <text x="60" y="194" class="s">projects</text>
  <path class="line" d="M160,123 L174,123" marker-end="url(#m-grey)"/>
  <rect class="blue" x="176" y="102" width="132" height="42" rx="8"/>
  <text x="186" y="120" class="b">usage rows</text>
  <text x="186" y="136" class="s">one per message</text>
  <path class="line" d="M308,123 L322,123" marker-end="url(#m-grey)"/>
  <path class="line" d="M160,169 L174,169" marker-end="url(#m-grey)"/>
  <rect class="green" x="176" y="148" width="132" height="42" rx="8"/>
  <text x="186" y="166" class="b">context sizes</text>
  <text x="186" y="182" class="s">lengths and counts</text>
  <path class="line" d="M308,169 L322,169" marker-end="url(#m-grey)"/>
  <path class="line" d="M160,215 L174,215" marker-end="url(#m-grey)"/>
  <rect class="purple" x="176" y="194" width="132" height="42" rx="8"/>
  <text x="186" y="212" class="b">ccusage weekly</text>
  <text x="186" y="228" class="s">daily totals</text>
  <path class="line" d="M308,215 L322,215" marker-end="url(#m-grey)"/>
  <rect class="blue" x="324" y="102" width="92" height="134" rx="8"/>
  <text x="370" y="150" class="b" text-anchor="middle">hash</text>
  <text x="370" y="170" class="s" text-anchor="middle">salted, ids</text>
  <text x="370" y="186" class="s" text-anchor="middle">and every</text>
  <text x="370" y="202" class="s" text-anchor="middle">name</text>
  <path class="line" d="M416,169 L430,169" marker-end="url(#m-grey)"/>
  <rect class="green" x="432" y="102" width="84" height="134" rx="8"/>
  <text x="474" y="150" class="b" text-anchor="middle">guard</text>
  <text x="474" y="170" class="s" text-anchor="middle">checks</text>
  <text x="474" y="186" class="s" text-anchor="middle">each column</text>
  <text x="474" y="206" class="s" text-anchor="middle">fail closed</text>
  <path class="line" d="M516,169 L530,169" marker-end="url(#m-grey)"/>
  <rect class="red" x="532" y="102" width="108" height="134" rx="8"/>
  <text x="586" y="150" class="b" text-anchor="middle">audit</text>
  <text x="586" y="170" class="s" text-anchor="middle">every file again</text>
  <text x="586" y="186" class="s" text-anchor="middle">before commit</text>
  <text x="586" y="202" class="s" text-anchor="middle">and push</text>
  <path class="line-orange" d="M370,236 L370,258" marker-end="url(#m-orange)"/>
  <rect class="orange" x="48" y="262" width="592" height="98" rx="8"/>
  <text x="64" y="284" class="b">Stays on this machine, never pushed</text>
  <text x="64" y="312" class="b">transcripts</text>
  <text x="64" y="330" class="s">prompts, code, paths</text>
  <text x="64" y="346" class="s">deleted after 30 days</text>
  <text x="208" y="312" class="b">salt</text>
  <text x="208" y="330" class="s">secret key behind</text>
  <text x="208" y="346" class="s">every hash</text>
  <text x="352" y="312" class="b">names.json</text>
  <text x="352" y="330" class="s">hash to real name,</text>
  <text x="352" y="346" class="s">read by your reports</text>
  <text x="500" y="312" class="b">state file</text>
  <text x="500" y="330" class="s">offsets, seen ids</text>
  <rect class="card" x="32" y="392" width="624" height="56" rx="10"/>
  <text x="48" y="425" class="b">Machine B, account: work</text>
  <rect class="blue" x="272" y="409" width="54" height="22" rx="11"/>
  <text x="299" y="424" class="s" text-anchor="middle">usage</text>
  <rect class="green" x="331" y="409" width="62" height="22" rx="11"/>
  <text x="362" y="424" class="s" text-anchor="middle">context</text>
  <rect class="purple" x="398" y="409" width="66" height="22" rx="11"/>
  <text x="431" y="424" class="s" text-anchor="middle">ccusage</text>
  <rect class="blue" x="469" y="409" width="46" height="22" rx="11"/>
  <text x="492" y="424" class="s" text-anchor="middle">hash</text>
  <rect class="green" x="520" y="409" width="50" height="22" rx="11"/>
  <text x="545" y="424" class="s" text-anchor="middle">guard</text>
  <rect class="red" x="575" y="409" width="50" height="22" rx="11"/>
  <text x="600" y="424" class="s" text-anchor="middle">audit</text>
  <rect class="card" x="32" y="460" width="624" height="56" rx="10"/>
  <text x="48" y="493" class="b">Machine C, account: personal</text>
  <rect class="blue" x="272" y="477" width="54" height="22" rx="11"/>
  <text x="299" y="492" class="s" text-anchor="middle">usage</text>
  <rect class="green" x="331" y="477" width="62" height="22" rx="11"/>
  <text x="362" y="492" class="s" text-anchor="middle">context</text>
  <rect class="purple" x="398" y="477" width="66" height="22" rx="11"/>
  <text x="431" y="492" class="s" text-anchor="middle">ccusage</text>
  <rect class="blue" x="469" y="477" width="46" height="22" rx="11"/>
  <text x="492" y="492" class="s" text-anchor="middle">hash</text>
  <rect class="green" x="520" y="477" width="50" height="22" rx="11"/>
  <text x="545" y="492" class="s" text-anchor="middle">guard</text>
  <rect class="red" x="575" y="477" width="50" height="22" rx="11"/>
  <text x="600" y="492" class="s" text-anchor="middle">audit</text>
  <path class="line-blue" d="M640,169 L674,169" marker-end="url(#m-blue)"/>
  <path class="line-blue" d="M656,420 C668,420 664,300 674,300" marker-end="url(#m-blue)"/>
  <path class="line-blue" d="M656,488 C672,488 664,324 674,324" marker-end="url(#m-blue)"/>
  <rect class="card" x="676" y="64" width="252" height="272" rx="10"/>
  <text x="692" y="92" class="h">Private data store</text>
  <text x="692" y="112" class="s">private git repo, per account</text>
  <rect class="blue" x="692" y="128" width="220" height="32" rx="8"/>
  <text x="702" y="149" class="s">usage rows (.csv)</text>
  <rect class="green" x="692" y="168" width="220" height="32" rx="8"/>
  <text x="702" y="189" class="s">context sizes (.context.csv)</text>
  <rect class="green" x="692" y="208" width="220" height="32" rx="8"/>
  <text x="702" y="229" class="s">skill uses, catalog names</text>
  <rect class="purple" x="692" y="248" width="220" height="32" rx="8"/>
  <text x="702" y="269" class="s">checks/  ccusage totals</text>
  <text x="692" y="304" class="s">names and ids appear as hashes</text>
  <text x="692" y="322" class="s">nothing lands here unaudited</text>
  <path class="line" d="M802,336 L802,354" marker-end="url(#m-grey)"/>
  <text x="812" y="350" class="s">pull</text>
  <rect class="card" x="676" y="356" width="252" height="188" rx="10"/>
  <text x="692" y="382" class="h">Research machine</text>
  <text x="692" y="400" class="s">a clone of the store</text>
  <rect class="card" x="692" y="412" width="220" height="30" rx="8"/>
  <text x="702" y="432" class="b">analyze</text><text x="772" y="432" class="s">text breakdowns</text>
  <rect class="card" x="692" y="448" width="220" height="30" rx="8"/>
  <text x="702" y="468" class="b">report</text><text x="772" y="468" class="s">static HTML page</text>
  <rect class="card" x="692" y="484" width="220" height="30" rx="8"/>
  <text x="702" y="504" class="b">compare</text><text x="772" y="504" class="s">rows vs ccusage</text>
  <text x="692" y="534" class="s">names show only via names.json</text>
  <rect class="card" x="32" y="560" width="896" height="116" rx="10"/>
  <text x="48" y="584" class="b">What actually leaves: one usage row, as stored (some columns left out)</text>
  <text y="608" class="mono-s"><tspan x="48">ts</tspan><tspan x="208">account</tspan><tspan x="270">project</tspan><tspan x="370">agent_type</tspan><tspan x="470">model</tspan><tspan x="602">input</tspan><tspan x="652">cache_read</tspan><tspan x="742">output</tspan><tspan x="806">tools</tspan></text>
  <text y="626" class="mono-v"><tspan x="48">2026-03-03T09:14:07Z</tspan><tspan x="208">work</tspan><tspan x="270">3f9a1c0e7b2d</tspan><tspan x="370">c41e07f2a9d3</tspan><tspan x="470">claude-opus-5-5</tspan><tspan x="602">12</tspan><tspan x="652">84120</tspan><tspan x="742">640</tspan><tspan x="806">5e1b9a7c3d20</tspan></text>
  <text x="48" y="650" class="s">Every id and name is a salted 12-character hash. Every other cell is a number, a time, a model name or a fixed label.</text>
  <text x="48" y="666" class="s">The guard refuses to write anything else, and the audit refuses to push anything else.</text>
  <rect class="orange" x="32" y="692" width="896" height="40" rx="10"/>
  <text x="48" y="717" class="s">Prompts, replies, code, paths, titles, branch names, attached text and real names never leave the machine they were written on.</text>
</svg>
