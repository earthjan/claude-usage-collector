<svg xmlns="http://www.w3.org/2000/svg" width="960" height="523" viewBox="0 0 960 523" role="img" aria-labelledby="title desc">
  <title id="title">Privacy boundary</title>
  <desc id="desc">Transcript content, attached instruction, skill and hook text, names, paths, the salt and the local name map stay on the machine. Only timestamps, counts, character lengths, short labels and salted hashes pass the guard and the audit, and tool, skill and agent names are hashed by default.</desc>
  <style>
    .bg { fill: #faf9f5; }
    .card { fill: #ffffff; stroke: #dedcd1; stroke-width: 1; }
    .blue { fill: #e6eef6; stroke: #6a9bcc; stroke-width: 1; }
    .green { fill: #eaefe4; stroke: #788c5d; stroke-width: 1; }
    .orange { fill: #f8e6de; stroke: #d97757; stroke-width: 1; }
    .purple { fill: #f5e6ed; stroke: #c46686; stroke-width: 1; }
    .red { fill: #f7e9e7; stroke: #c9645a; stroke-width: 1; }
    .ink { fill: #5e5d59; }
    text { fill: #141413; font-family: 'Anthropic Sans', system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .s { font-size: 12px; fill: #5e5d59; }
    .mono { font-family: 'Anthropic Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .num { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .line { stroke: #87867f; stroke-width: 1.5; fill: none; }
    .line-blue { stroke: #3d6fa3; stroke-width: 1.5; fill: none; }
    .line-purple { stroke: #a64d87; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .line-red { stroke: #b5544a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .a-grey { fill: #87867f; }
    .a-blue { fill: #3d6fa3; }
    .a-purple { fill: #a64d87; }
    .a-red { fill: #b5544a; }
    .dot-blue { fill: #3d6fa3; }
    .dot-green { fill: #5e7a45; }
    .dot-orange { fill: #c2613f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #141413; }
      .card { fill: #1f1e1d; stroke: #3d3d3a; }
      .blue { fill: #1b2530; stroke: #6a9bcc; }
      .green { fill: #1d241b; stroke: #788c5d; }
      .orange { fill: #2e1e18; stroke: #d97757; }
      .purple { fill: #2b1c23; stroke: #c46686; }
      .red { fill: #2e1a19; stroke: #c9645a; }
      .ink { fill: #b0aea5; }
      text { fill: #faf9f5; }
      .s { fill: #b0aea5; }
      .num { fill: #141413; }
      .line { stroke: #87867f; }
      .line-blue { stroke: #6a9bcc; }
      .line-purple { stroke: #d58ba6; }
      .line-red { stroke: #e07a6e; }
      .a-grey { fill: #87867f; }
      .a-blue { fill: #6a9bcc; }
      .a-purple { fill: #d58ba6; }
      .a-red { fill: #e07a6e; }
      .dot-blue { fill: #6a9bcc; }
      .dot-green { fill: #9db57e; }
      .dot-orange { fill: #d97757; }
    }
  </style>
  <defs>
    <marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-grey" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="523" rx="16"/>
  <text x="24" y="40" class="h">What stays, what leaves</text>
  <text x="220" y="40" class="s">the guard and the audit both fail closed</text>
  <rect class="orange" x="24" y="64" width="380" height="435" rx="12"/>
  <text x="44" y="94" class="h">Stays on this machine</text>
  <rect class="green" x="556" y="64" width="380" height="435" rx="12"/>
  <text x="576" y="94" class="h">Leaves, after the guard and the audit</text>
  <circle class="dot-orange" cx="48" cy="124" r="3.5"/>
  <text x="62" y="128">Prompts and replies</text>
  <circle class="dot-orange" cx="48" cy="155" r="3.5"/>
  <text x="62" y="159">Thinking blocks</text>
  <circle class="dot-orange" cx="48" cy="186" r="3.5"/>
  <text x="62" y="190">Code, tool inputs and tool outputs</text>
  <circle class="dot-orange" cx="48" cy="217" r="3.5"/>
  <text x="62" y="221">Session titles, agent descriptions</text>
  <circle class="dot-orange" cx="48" cy="248" r="3.5"/>
  <text x="62" y="252">File paths and project folder names</text>
  <circle class="dot-orange" cx="48" cy="279" r="3.5"/>
  <text x="62" y="283">Git branch names</text>
  <circle class="dot-orange" cx="48" cy="310" r="3.5"/>
  <text x="62" y="314">Instruction, skill and hook text</text>
  <circle class="dot-orange" cx="48" cy="341" r="3.5"/>
  <text x="62" y="345">System prompt, listings, MCP blocks</text>
  <circle class="dot-orange" cx="48" cy="372" r="3.5"/>
  <text x="62" y="376">Hostname, session ids, agent ids</text>
  <circle class="dot-orange" cx="48" cy="403" r="3.5"/>
  <text x="62" y="407">The salt (config folder, mode 600)</text>
  <circle class="dot-orange" cx="48" cy="434" r="3.5"/>
  <text x="62" y="438">Offsets, seen ids, marks (state file)</text>
  <circle class="dot-orange" cx="48" cy="465" r="3.5"/>
  <text x="62" y="469">Name map, names.json (config folder, mode 600)</text>
  <circle class="dot-green" cx="580" cy="124" r="3.5"/>
  <text x="594" y="128">Timestamps, UTC (optional: hour only)</text>
  <circle class="dot-green" cx="580" cy="155" r="3.5"/>
  <text x="594" y="159">Token counts: input, cache, output</text>
  <circle class="dot-green" cx="580" cy="186" r="3.5"/>
  <text x="594" y="190">Context sizes: lengths and counts</text>
  <circle class="dot-green" cx="580" cy="217" r="3.5"/>
  <text x="594" y="221">Model slug and effort level</text>
  <circle class="dot-green" cx="580" cy="248" r="3.5"/>
  <text x="594" y="252">Tool names (hashed by default)</text>
  <circle class="dot-green" cx="580" cy="279" r="3.5"/>
  <text x="594" y="283">Agent type, spawn depth, fork flag</text>
  <circle class="dot-green" cx="580" cy="310" r="3.5"/>
  <text x="594" y="314">Skill and agent names (hashed by default)</text>
  <circle class="dot-green" cx="580" cy="341" r="3.5"/>
  <text x="594" y="345">Salted hashes of project and session</text>
  <circle class="dot-green" cx="580" cy="372" r="3.5"/>
  <text x="594" y="376">Salted hashes of agent and machine</text>
  <circle class="dot-green" cx="580" cy="403" r="3.5"/>
  <text x="594" y="407">Web search and fetch counts</text>
  <circle class="dot-green" cx="580" cy="434" r="3.5"/>
  <text x="594" y="438">Account label you chose, e.g. work</text>
  <rect class="card" x="424" y="168" width="112" height="196" rx="12"/>
  <text x="480" y="228" class="h" text-anchor="middle">guard</text>
  <text x="480" y="268" class="s" text-anchor="middle">one schema</text>
  <text x="480" y="288" class="s" text-anchor="middle">per file</text>
  <text x="480" y="308" class="s" text-anchor="middle">fail closed</text>
  <text x="480" y="336" class="s" text-anchor="middle">audit at push</text>
  <path class="line" d="M404,266 L422,266" marker-end="url(#m-grey)"/>
  <path class="line-blue" d="M536,266 L554,266" marker-end="url(#m-blue)"/>
</svg>
