<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc">
  <title id="title">Store layout</title>
  <desc id="desc">A store has one folder per account, up to four CSV files per UTC day (usage rows, context sizes, skill uses, listed names), and a checks folder for weekly ccusage totals.</desc>
  <style>
    .bg { fill: #faf9f5; }
    .card { fill: #ffffff; stroke: #dedcd1; stroke-width: 1; }
    .blue { fill: #e6eef6; stroke: #6a9bcc; stroke-width: 1; }
    .green { fill: #eaefe4; stroke: #788c5d; stroke-width: 1; }
    .orange { fill: #f8e6de; stroke: #d97757; stroke-width: 1; }
    .purple { fill: #f5e6ed; stroke: #c46686; stroke-width: 1; }
    .red { fill: #f7e9e7; stroke: #c9645a; stroke-width: 1; }
    .ink { fill: #5e5d59; }
    text { fill: #141413; font-family: 'Anthropic Sans', system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .s { font-size: 12px; fill: #5e5d59; }
    .mono { font-family: 'Anthropic Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .num { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .line { stroke: #87867f; stroke-width: 1.5; fill: none; }
    .line-blue { stroke: #3d6fa3; stroke-width: 1.5; fill: none; }
    .line-purple { stroke: #a64d87; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .line-red { stroke: #b5544a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .a-grey { fill: #87867f; }
    .a-blue { fill: #3d6fa3; }
    .a-purple { fill: #a64d87; }
    .a-red { fill: #b5544a; }
    .dot-blue { fill: #3d6fa3; }
    .dot-green { fill: #5e7a45; }
    .dot-orange { fill: #c2613f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #141413; }
      .card { fill: #1f1e1d; stroke: #3d3d3a; }
      .blue { fill: #1b2530; stroke: #6a9bcc; }
      .green { fill: #1d241b; stroke: #788c5d; }
      .orange { fill: #2e1e18; stroke: #d97757; }
      .purple { fill: #2b1c23; stroke: #c46686; }
      .red { fill: #2e1a19; stroke: #c9645a; }
      .ink { fill: #b0aea5; }
      text { fill: #faf9f5; }
      .s { fill: #b0aea5; }
      .num { fill: #141413; }
      .line { stroke: #87867f; }
      .line-blue { stroke: #6a9bcc; }
      .line-purple { stroke: #d58ba6; }
      .line-red { stroke: #e07a6e; }
      .a-grey { fill: #87867f; }
      .a-blue { fill: #6a9bcc; }
      .a-purple { fill: #d58ba6; }
      .a-red { fill: #e07a6e; }
      .dot-blue { fill: #6a9bcc; }
      .dot-green { fill: #9db57e; }
      .dot-orange { fill: #d97757; }
    }
  </style>
  <defs>
    <marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-grey" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="404" rx="16"/>
  <text x="24" y="40" class="h">Store layout</text>
  <text x="132" y="40" class="s">plain folders and CSV files, readable with any tool</text>
  <rect class="card" x="24" y="64" width="420" height="316" rx="10"/>
  <text x="48" y="92" class="mono b">usage-data/</text>
  <text x="64" y="112" class="mono s">.gitattributes</text>
  <text x="64" y="132" class="mono b">work/</text>
  <text x="80" y="152" class="mono">2026/01/</text>
  <text x="96" y="172" class="mono s">2026-01-14.csv</text>
  <text x="96" y="192" class="mono s">2026-01-14.context.csv</text>
  <text x="96" y="212" class="mono s">2026-01-14.skills.csv</text>
  <text x="96" y="232" class="mono s">2026-01-14.catalog.csv</text>
  <text x="64" y="252" class="mono b">personal/</text>
  <text x="80" y="272" class="mono">2026/01/</text>
  <text x="96" y="292" class="mono s">2026-01-14.csv</text>
  <text x="64" y="312" class="mono b">checks/</text>
  <text x="80" y="332" class="mono s">work/&lt;machine&gt;/2026-W03.json</text>
  <text x="80" y="352" class="mono s">personal/&lt;machine&gt;/2026-W03.json</text>
  <rect class="blue" x="476" y="64" width="460" height="66" rx="10"/>
  <text x="492" y="91" class="b">One folder per account</text>
  <text x="492" y="112" class="s">Each machine appends only to its own account.</text>
  <rect class="blue" x="476" y="144" width="460" height="66" rx="10"/>
  <text x="492" y="171" class="b">Up to four CSV files per UTC day</text>
  <text x="492" y="192" class="s">Usage rows, context sizes, skill uses, listed names.</text>
  <rect class="purple" x="476" y="224" width="460" height="66" rx="10"/>
  <text x="492" y="251" class="b">checks/ holds ccusage totals</text>
  <text x="492" y="272" class="s">One JSON file per account, machine and ISO week.</text>
  <rect class="card" x="476" y="304" width="460" height="66" rx="10"/>
  <text x="492" y="331" class="b">Two machines, one account</text>
  <text x="492" y="352" class="s">Rows carry a machine hash. Git merges appends.</text>
</svg>
