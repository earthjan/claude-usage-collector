<svg xmlns="http://www.w3.org/2000/svg" width="960" height="384" viewBox="0 0 960 384" role="img" aria-labelledby="title desc">
  <title id="title">Store layout</title>
  <desc id="desc">A store has one folder per account, one CSV per UTC day, and a checks folder for monthly ccusage totals.</desc>
  <style>
    .bg { fill: #f6f8fa; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .blue { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
    .green { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1; }
    .orange { fill: #fff1e5; stroke: #fb8f44; stroke-width: 1; }
    .purple { fill: #fbefff; stroke: #c297ff; stroke-width: 1; }
    .red { fill: #ffebe9; stroke: #ff8182; stroke-width: 1; }
    .ink { fill: #59636e; }
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .s { font-size: 12px; fill: #59636e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .num { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .line { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .line-blue { stroke: #0969da; stroke-width: 1.5; fill: none; }
    .line-purple { stroke: #8250df; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .line-red { stroke: #cf222e; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .a-grey { fill: #8c959f; }
    .a-blue { fill: #0969da; }
    .a-purple { fill: #8250df; }
    .a-red { fill: #cf222e; }
    .dot-blue { fill: #0969da; }
    .dot-green { fill: #1a7f37; }
    .dot-orange { fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .blue { fill: #0f2140; stroke: #1f6feb; }
      .green { fill: #0f2a1a; stroke: #2ea043; }
      .orange { fill: #2b1a0c; stroke: #db6d28; }
      .purple { fill: #231a36; stroke: #8957e5; }
      .red { fill: #2d1214; stroke: #da3633; }
      .ink { fill: #9198a1; }
      text { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .num { fill: #0d1117; }
      .line { stroke: #6e7681; }
      .line-blue { stroke: #4493f8; }
      .line-purple { stroke: #ab7df8; }
      .line-red { stroke: #f85149; }
      .a-grey { fill: #6e7681; }
      .a-blue { fill: #4493f8; }
      .a-purple { fill: #ab7df8; }
      .a-red { fill: #f85149; }
      .dot-blue { fill: #4493f8; }
      .dot-green { fill: #3fb950; }
      .dot-orange { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-grey" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="384" rx="16"/>
  <text x="24" y="40" class="h">Store layout</text>
  <text x="132" y="40" class="s">plain folders and CSV files, readable with any tool</text>
  <rect class="card" x="24" y="64" width="420" height="296" rx="10"/>
  <text x="48" y="96" class="mono b">usage-data/</text>
  <text x="64" y="118" class="mono s">.gitattributes</text>
  <text x="64" y="140" class="mono b">work/</text>
  <text x="80" y="162" class="mono">2026/01/</text>
  <text x="96" y="184" class="mono s">2026-01-14.csv</text>
  <text x="96" y="206" class="mono s">2026-01-15.csv</text>
  <text x="64" y="228" class="mono b">personal/</text>
  <text x="80" y="250" class="mono">2026/01/</text>
  <text x="96" y="272" class="mono s">2026-01-14.csv</text>
  <text x="64" y="294" class="mono b">checks/</text>
  <text x="80" y="316" class="mono s">work/&lt;machine&gt;/2025-12.json</text>
  <text x="80" y="338" class="mono s">personal/&lt;machine&gt;/2025-12.json</text>
  <rect class="blue" x="476" y="64" width="460" height="62" rx="10"/>
  <text x="492" y="89" class="b">One folder per account</text>
  <text x="492" y="109" class="s">Each machine appends only to its own account.</text>
  <rect class="blue" x="476" y="140" width="460" height="62" rx="10"/>
  <text x="492" y="165" class="b">One CSV per UTC day</text>
  <text x="492" y="185" class="s">Header written once, new rows appended.</text>
  <rect class="purple" x="476" y="216" width="460" height="62" rx="10"/>
  <text x="492" y="241" class="b">checks/ holds ccusage totals</text>
  <text x="492" y="261" class="s">One JSON file per account, machine and month.</text>
  <rect class="card" x="476" y="292" width="460" height="62" rx="10"/>
  <text x="492" y="317" class="b">Two machines, one account</text>
  <text x="492" y="337" class="s">Rows carry a machine hash. Git merges appends.</text>
</svg>
